# The firmware boots and starts ESPHome. It must do so with no reachable
# Wi-Fi network, because the lamp works without one.
name: Boots without Wi-Fi
version: 1
steps:
  # ESPHome logs the end of setup() before it prints its version banner, and
  # wait-serial only matches output after the previous step.
  - wait-serial: "setup() finished successfully"
  - wait-serial: "ESPHome version"
