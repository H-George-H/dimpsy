# ESPHome configuration for the Dimpsy prototype (proto-1).
# https://esphome.io
#
# The first prototype uses an ESP32 DevKitC (ESP32-WROOM-32 module).
# See docs/decisions/0007-microcontroller-board.md for the board and the
# provisional pin map, and docs/decisions/0004-prototype-firmware-platform.md
# for the choice of ESPHome. The board for the finished lamp is not yet decided.
#
# Copy secrets.yaml.example to secrets.yaml and fill it in before building.

esphome:
  name: dimpsy
  # Read the RTC at start-up, so the time is right before Wi-Fi connects.
  on_boot:
    priority: -100
    then:
      - ds1307.read_time:
          id: rtc_time

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret ota_password

# The lamp must work fully without a network (see docs/design-principles.md).
# Wi-Fi is only for settings, time and updates, so nothing here may block the
# lamp's local behaviour when the network is missing.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Where there is no Wi-Fi (for example in the attic), the lamp starts its own
  # network after ESPHome's default ap_timeout of 90 seconds. Join "Dimpsy
  # Fallback" and open 192.168.4.1.
  ap:
    ssid: Dimpsy Fallback
    password: !secret ap_password

# Opens the settings page automatically when a phone joins the fallback network.
captive_portal:

# DS3231 real-time clock on the default I2C pins (decision 0007). ESPHome's
# ds1307 platform also drives the DS3231. The RTC keeps the time with no network;
# network time corrects it whenever Wi-Fi is connected.
i2c:
  sda: 21
  scl: 22

time:
  - platform: ds1307
    id: rtc_time
    update_interval: never
  - platform: sntp
    id: sntp_time
    timezone: Europe/London
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc_time

# Reachable as http://dimpsy.local, so there is no need to look up the IP address.
mdns:

# The settings page, plus ESPHome's REST API and live log stream (on by default).
# Examples, with each entity's id from the page:
#   curl -X POST http://dimpsy.local/light/built-in_led/turn_on
#   curl http://dimpsy.local/sensor/wi-fi_signal
#   curl -N http://dimpsy.local/events   (live log and state stream)
web_server:
  port: 80
  log: true

# Diagnostics, shown on the settings page and available over the REST API.
debug:
  update_interval: 30s

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 30s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Free Heap"
    block:
      name: "Largest Free Heap Block"
    loop_time:
      name: "Loop Time"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Wi-Fi Network"
    mac_address:
      name: "MAC Address"
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: template
    name: "Clock"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return id(rtc_time).now().strftime("%Y-%m-%d %H:%M:%S");
  - platform: template
    name: "Clock Source"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return id(sntp_time).has_time() ? std::string("Synced") : std::string("Not synced");

# The board's built-in LED, for bare-board testing. Many ESP32 DevKitC boards
# have it on GPIO2; on boards without one, wire an LED and resistor to GPIO2.
# The web server above shows it as a switch on the settings page.
output:
  - platform: gpio
    pin: GPIO2
    id: onboard_led_output

light:
  - platform: binary
    name: "Built-in LED"
    id: onboard_led
    output: onboard_led_output
