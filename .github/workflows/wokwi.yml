name: Wokwi simulation

on:
  push:
    branches: [main]
    paths:
      - "firmware/esphome/**"
      - "firmware/core/**"
      - ".github/workflows/wokwi.yml"
  pull_request:
    paths:
      - "firmware/esphome/**"
      - "firmware/core/**"
      - ".github/workflows/wokwi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Simulate firmware
    runs-on: ubuntu-latest
    env:
      # Repository secret. Not available to pull requests from forks.
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - name: Check for Wokwi token
        id: token
        run: |
          if [ -n "$WOKWI_CLI_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WOKWI_CLI_TOKEN is not set, so the simulation was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.token.outputs.present == 'true'
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('firmware/esphome/dimpsy.yaml', 'firmware/esphome/requirements.txt') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install ESPHome
        if: steps.token.outputs.present == 'true'
        run: pip install -r firmware/esphome/requirements.txt
      - name: Create placeholder secrets
        if: steps.token.outputs.present == 'true'
        working-directory: firmware/esphome
        run: cp secrets.yaml.example secrets.yaml
      - name: Build
        if: steps.token.outputs.present == 'true'
        working-directory: firmware/esphome
        run: esphome compile dimpsy.yaml
      - name: Probe build output
        if: steps.token.outputs.present == 'true'
        working-directory: firmware/esphome
        run: |
          ls -l .esphome/build/dimpsy/build/*.bin .esphome/build/dimpsy/build/*.elf || true
          xxd -l 32 .esphome/build/dimpsy/build/firmware.factory.bin
          grep -E 'CONFIG_ESP32_REV_MIN|CONFIG_ESPTOOLPY_FLASHSIZE=|CONFIG_ESPTOOLPY_FLASHFREQ=|CONFIG_ESPTOOLPY_FLASHMODE=|CONFIG_ESP_CONSOLE_UART|CONFIG_ESP_CONSOLE_UART_BAUDRATE' .esphome/build/dimpsy/sdkconfig.dimpsy || true
      - name: Install wokwi-cli
        if: steps.token.outputs.present == 'true'
        run: |
          wget -q -O /usr/local/bin/wokwi-cli https://github.com/wokwi/wokwi-cli/releases/latest/download/wokwi-cli-linuxstatic-x64
          chmod +x /usr/local/bin/wokwi-cli
      - name: Probe full diagram
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        working-directory: firmware/esphome
        run: wokwi-cli --timeout 40000 --diagram-file diagram.json . 2>&1 | head -c 6000
      - name: Probe bare ESP32
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        working-directory: firmware/esphome
        run: |
          cat > bare.json <<'JSON'
          {"version":1,"author":"x","editor":"wokwi","parts":[{"type":"board-esp32-devkit-c-v4","id":"esp32","top":0,"left":0,"attrs":{}}],"connections":[],"dependencies":{}}
          JSON
          wokwi-cli --timeout 40000 --diagram-file bare.json . 2>&1 | head -c 6000
      - name: Show serial log
        if: always() && steps.token.outputs.present == 'true'
        run: |
          for f in wokwi-serial.log firmware/esphome/wokwi-serial.log; do
            if [ -e "$f" ]; then
              echo "::group::$f ($(wc -c < "$f") bytes)"
              cat -v "$f"
              echo "::endgroup::"
            fi
          done
      - name: Upload serial log
        if: always() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wokwi-serial-log
          path: |
            wokwi-serial.log
            firmware/esphome/wokwi-serial.log
          if-no-files-found: ignore
